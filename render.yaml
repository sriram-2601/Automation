services:
  - type: web
    name: agentflow-ai
    env: node
    plan: free
    buildCommand: npm install && npm run install-all && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        description: "Random secret key for signing JWT tokens"
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
